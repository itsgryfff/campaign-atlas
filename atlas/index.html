<title>Campaign Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: the map fills the left like a table spread; a ledger rail on the right holds details, the NPC roster and the web of connections. */
:root {
  --bg: #e6ebef;
  --surface: #f8fafb;
  --hover: #edf1f5;
  --ink: #1a2330;
  --muted: #5a6879;
  --line: #c8d1da;
  --grid: rgba(43, 76, 140, .07);
  --accent: #2b4c8c;
  --on-accent: #ffffff;
  --brass: #a8740f;
  --tint: #fbf3df;
  --bad: #b3261e;
  --good: #2a7a4b;
  --well: #d9e0e6;
  --shadow: rgba(16, 24, 36, .28);
  --gridline: rgba(20, 20, 20, .38);
  --tok-ink: #ffffff;
  --tok-ring: rgba(255, 255, 255, .9);
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --surface: #19202a; --hover: #212a36; --ink: #e2e7ee; --muted: #8e9bad; --line: #2c3543;
    --grid: rgba(143, 176, 236, .05); --accent: #8fb0ec; --on-accent: #0f1726; --brass: #e2b24c; --tint: #2a2516;
    --bad: #f2776c; --good: #6fcf97; --well: #0c1015; --shadow: rgba(0, 0, 0, .55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --surface: #19202a; --hover: #212a36; --ink: #e2e7ee; --muted: #8e9bad; --line: #2c3543;
  --grid: rgba(143, 176, 236, .05); --accent: #8fb0ec; --on-accent: #0f1726; --brass: #e2b24c; --tint: #2a2516;
  --bad: #f2776c; --good: #6fcf97; --well: #0c1015; --shadow: rgba(0, 0, 0, .55); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
.app { max-width: 1480px; margin: 0 auto; padding: 16px 16px 32px; display: grid; gap: 12px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: .02em; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.1rem; }
h3 { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-family: var(--body); font-weight: 700; }
.lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: .4rem .7rem;
  cursor: pointer; font-weight: 600; font-size: .85rem; line-height: 1.2;
}
button:hover { background: var(--hover); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
/* Upload controls are labels tied to the file input, so a tap opens the picker directly. */
label.btn { display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: .4rem .7rem; cursor: pointer; font-weight: 600; font-size: .85rem; line-height: 1.2; }
label.btn:hover { background: var(--hover); }
label.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
button.danger { color: var(--bad); }
button.armed { background: var(--bad); color: var(--surface); border-color: var(--bad); }
button.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; text-align: left; }
button.link:hover { text-decoration: underline; background: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: .4rem .55rem; min-width: 0; width: 100%; }
textarea { resize: vertical; min-height: 110px; line-height: 1.45; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.brand { min-width: 0; }
.brand p { margin: 0; color: var(--muted); font-size: .85rem; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; flex: 1 1 280px; min-width: 0; font-size: .9rem; }
.crumbs button { border: 0; background: none; padding: .2rem .3rem; color: var(--accent); }
.crumbs .sep { color: var(--muted); }
.crumbs .here { font-weight: 700; padding: .2rem .3rem; }
.topctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.topctl select { width: auto; max-width: 240px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* Map viewport */
.mapwrap { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--well); height: min(78vh, 860px); min-height: 420px; }
@media (max-width: 980px) { .mapwrap { height: 64vh; min-height: 360px; } }
.viewport { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.viewport.panning { cursor: grabbing; }
.viewport.adding { cursor: crosshair; }
.stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; --inv: 1; }
.stage img { display: block; pointer-events: none; -webkit-user-drag: none; box-shadow: 0 2px 18px var(--shadow); }
.pins { position: absolute; inset: 0; }

.pin { position: absolute; padding: 0; border: 0; background: none; cursor: pointer; transform: translate(-50%, -100%) scale(var(--inv)); transform-origin: 50% 100%; }
.pin:hover { background: none; }
.pin .mk { display: block; width: 34px; height: 42px; filter: drop-shadow(0 2px 3px var(--shadow)); }
.pin .mk path.body { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.pin .mk path.glyph { fill: var(--on-accent); }
.pin.t-dungeon .mk path.body { fill: var(--bad); }
.pin.t-landmark .mk path.body, .pin.t-wilderness .mk path.body { fill: var(--good); }
.pin.t-poi .mk path.body { fill: var(--brass); }
.pin .nm { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 2px; white-space: nowrap; font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); pointer-events: none; }
.hidelabels .pin .nm { display: none; }
.pin.npc { transform: translate(-50%, -50%) scale(var(--inv)); transform-origin: 50% 50%; }
.face { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; font-weight: 700; font-size: 12px; background: var(--surface); color: var(--ink); border: 3px solid var(--muted); box-shadow: 0 2px 4px var(--shadow); letter-spacing: .02em; }
.att-friendly .face, .face.att-friendly { border-color: var(--good); }
.att-hostile .face, .face.att-hostile { border-color: var(--bad); }
.att-unknown .face, .face.att-unknown { border-color: var(--brass); }
.pin.sel .mk { filter: drop-shadow(0 0 0 var(--brass)) drop-shadow(0 0 4px var(--brass)); }
.pin.sel .face { outline: 3px solid var(--brass); outline-offset: 2px; }
.pin.sel .nm { border-color: var(--brass); }
.pin.dragging { opacity: .75; }
.mapbadge { position: absolute; right: -8px; top: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--brass); border: 2px solid var(--surface); display: grid; place-items: center; box-shadow: 0 1px 3px var(--shadow); }
.mapbadge svg { width: 12px; height: 12px; fill: none; stroke: var(--surface); stroke-width: 1.6; stroke-linejoin: round; }
.pin.has-map .nm { border-color: var(--brass); }
.pin.has-map:hover .mk { transform: translateY(-2px); }
.pin .mk { transition: transform .15s ease; }
.upbtn { display: flex; align-items: center; gap: 4px; }

.mapbar { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; z-index: 2; }
.mapbar > * { pointer-events: auto; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); box-shadow: 0 1px 4px var(--shadow); }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.hintbar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 6px 12px; border-radius: 999px; font-size: .85rem; font-weight: 600; z-index: 2; max-width: calc(100% - 24px); text-align: center; }
.mapempty { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
.mapempty .inner { max-width: 420px; display: grid; gap: 10px; justify-items: center; }
.mapempty p { margin: 0; color: var(--muted); }
.dropzone { position: absolute; inset: 0; border: 3px dashed var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); display: grid; place-items: center; font-weight: 700; font-size: 1.1rem; color: var(--accent); z-index: 3; pointer-events: none; }

/* Side rail */
.rail { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; display: grid; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; border-radius: 0; background: none; padding: .7rem .5rem; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brass); }
.pane { padding: 14px 16px 18px; display: grid; gap: 14px; align-content: start; max-height: calc(min(78vh, 860px) - 46px); overflow-y: auto; }
@media (max-width: 980px) { .pane { max-height: none; } }
.field { display: grid; gap: 4px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kicker { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { font-size: .72rem; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--hover); font-weight: 700; }
.chip.ex { border-color: var(--brass); color: var(--brass); background: var(--tint); }
.list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; border: 0; background: none; text-align: left; font-weight: 400; width: 100%; }
.item:hover { background: var(--hover); }
.item .t { font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .s { color: var(--muted); font-size: .8rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .face { width: 30px; height: 30px; font-size: 11px; border-width: 2px; box-shadow: none; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.dot.t-dungeon { background: var(--bad); } .dot.t-landmark, .dot.t-wilderness { background: var(--good); } .dot.t-poi { background: var(--brass); }
.muted { color: var(--muted); font-size: .88rem; margin: 0; }
.section { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.links { display: grid; gap: 4px; }
.link-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 0; }
.link-row .who { min-width: 0; }
.link-row .lab { color: var(--muted); font-size: .85rem; }
.addlink { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 6px; }
.x { border: 0; background: none; color: var(--muted); padding: .2rem .4rem; font-size: 1rem; }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; }
.search { display: flex; gap: 6px; }
.banner { background: var(--tint); border: 1px solid var(--brass); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; font-size: .88rem; }
.banner p { margin: 0; }

.graph { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 8px; background: var(--hover); }
.graph text { font-family: var(--body); fill: var(--ink); }
.graph .edge { stroke: var(--muted); stroke-width: 1.5; }
.graph .edge.hot { stroke: var(--brass); stroke-width: 2.5; }
.graph .elab { font-size: 9px; fill: var(--muted); paint-order: stroke; stroke: var(--hover); stroke-width: 3px; }
.graph .elab.hot { fill: var(--ink); font-weight: 700; }
.graph .node { cursor: pointer; }
.graph .node circle { fill: var(--surface); stroke: var(--muted); stroke-width: 3; }
.graph .node.att-friendly circle { stroke: var(--good); }
.graph .node.att-hostile circle { stroke: var(--bad); }
.graph .node.att-unknown circle { stroke: var(--brass); }
.graph .node.sel circle { fill: var(--tint); }
.graph .node .ini { font-size: 11px; font-weight: 700; }
.graph .node .gname { font-size: 10px; font-weight: 600; paint-order: stroke; stroke: var(--hover); stroke-width: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: .78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--muted); display: inline-block; }
.legend i.f { border-color: var(--good); } .legend i.h { border-color: var(--bad); } .legend i.u { border-color: var(--brass); }

.dmtoggle[aria-pressed="true"] { background: var(--brass); color: var(--surface); border-color: var(--brass); }
.dm .top { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
.chip.dm { border-color: var(--brass); color: var(--brass); background: var(--tint); }
.sheet-top { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.abil { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.ab { display: grid; gap: 3px; justify-items: center; text-align: center; border: 1px solid var(--line); border-radius: 6px; padding: 6px 4px; background: var(--hover); min-width: 0; }
.ab input { text-align: center; padding: .25rem .1rem; font-family: var(--mono); }
.modbtn { font-family: var(--mono); padding: .15rem .3rem; font-size: .8rem; width: 100%; }
.attach { display: grid; gap: 8px; }
.attach img { max-height: 220px; width: 100%; object-fit: contain; border: 1px solid var(--line); border-radius: 6px; background: var(--hover); }
.btnlink { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: .4rem .7rem; font-weight: 600; font-size: .85rem; color: var(--accent); text-decoration: none; background: var(--surface); }
.btnlink:hover { background: var(--hover); }
@media (max-width: 440px) { .abil { grid-template-columns: repeat(3, minmax(0, 1fr)); } .sheet-top { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pin.hid { opacity: .6; }
.pin.hid .nm { border-style: dashed; }
.pin.hid .nm::before { content: "Hidden \00b7  "; color: var(--muted); font-weight: 600; }
.chip.hid { border-style: dashed; color: var(--muted); }
.vis { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.vis input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); }
.vis b { display: block; font-size: .9rem; }
.vis small { color: var(--muted); font-size: .8rem; }
.vis.off { border-style: dashed; background: var(--hover); }
.pvtoggle[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.pvbanner { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; background: var(--accent); color: var(--on-accent); padding: 8px 12px; border-radius: 8px; font-size: .88rem; font-weight: 600; box-shadow: 0 2px 8px var(--shadow); }
.pvbanner button { background: var(--surface); color: var(--ink); border-color: var(--surface); }
.rolechip { font-size: .72rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); font-weight: 700; }
.lbl .aside { text-transform: none; letter-spacing: 0; font-weight: 400; }
.untold { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.untold li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; padding: 6px 6px 6px 10px; border: 1px dashed var(--brass); border-radius: 6px; background: var(--tint); }
.untold li span { overflow-wrap: anywhere; white-space: pre-wrap; }
.untold li button { font-size: .78rem; padding: .3rem .5rem; }
.addline { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
/* Battle maps: grid and tokens. Tokens scale with the map, unlike pins. */
.gridlayer { position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(to right, var(--gridline) 1px, transparent 1px), linear-gradient(to bottom, var(--gridline) 1px, transparent 1px); }
.pin.tok { transform: translate(-50%, -50%); transform-origin: 50% 50%; }
.pin.tok .disc { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: var(--tc); color: var(--tok-ink); font-weight: 700; font-size: 1.15em; border: .12em solid var(--tok-ring); box-shadow: 0 .1em .35em var(--shadow); }
.pin.tok .nm { font-size: .8em; padding: 0 .4em; margin-top: .15em; }
.pin.tok.movable { cursor: grab; }
.pin.tok.sel .disc { outline: .18em solid var(--brass); outline-offset: .12em; }
.pin.tok.hid .disc { opacity: .55; border-style: dashed; }
.pin.tok .disc.img { background: var(--ti) center / cover no-repeat, var(--tc); color: transparent; border-color: var(--tc); border-width: .16em; }
.tokpic { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tokpic .pv { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--tc); background: var(--ti) center / cover no-repeat, var(--tc); display: grid; place-items: center; color: var(--tok-ink); font-weight: 700; font-size: 1.3rem; flex: none; }
/* Character sheets */
.party { display: grid; gap: 8px; }
.pc-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: left; font-weight: 400; width: 100%; }
.pc-card:hover { border-color: var(--accent); background: var(--surface); }
.pc-card .t { font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-card .s { color: var(--muted); font-size: .82rem; display: block; }
.pc-card .stats { font-family: var(--mono); font-size: .8rem; text-align: right; }
.pc-card .hpbar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--hover); overflow: hidden; }
.pc-card .hpbar i { display: block; height: 100%; background: var(--good); }
.pc-card .hpbar i.low { background: var(--bad); }
.cs-modal { position: fixed; inset: 0; z-index: 26; display: grid; place-items: center; padding: 12px; background: rgba(10, 14, 20, .5); }
.cs-sheet { width: min(980px, 100%); max-height: 92vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.cs-head { position: sticky; top: 0; z-index: 1; background: var(--surface); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.cs-head h2 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cs-body { padding: 14px 16px 20px; display: grid; gap: 16px; }
.cs-id { display: grid; grid-template-columns: 2fr 1.4fr .6fr 1.2fr 1.2fr; gap: 8px; }
.cs-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.cs-box { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; display: grid; gap: 2px; justify-items: center; text-align: center; background: var(--hover); min-width: 0; }
.cs-box input { text-align: center; font-family: var(--mono); padding: .25rem .2rem; }
.cs-box .big { font-family: var(--mono); font-size: 1.25rem; font-weight: 700; }
.cs-hp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 100%; }
.cs-hp small { color: var(--muted); font-size: .68rem; }
.cs-main { display: grid; grid-template-columns: 220px minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; align-items: start; }
.cs-abil { display: grid; gap: 6px; }
.cs-ab { display: grid; grid-template-columns: 44px 64px minmax(0, 1fr); gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
.cs-ab .nm { font-weight: 700; font-size: .78rem; letter-spacing: .08em; }
.cs-ab input { text-align: center; font-family: var(--mono); padding: .3rem .2rem; }
.cs-ab .mods { display: grid; gap: 3px; }
.roll { font-family: var(--mono); font-size: .85rem; padding: .2rem .4rem; }
.cs-skills { display: grid; gap: 2px; }

/* Dice rolls float up from the roller's token and fade out over 15 seconds. */
.floats { position: absolute; inset: 0; pointer-events: none; }

@keyframes rollUp { 0% { transform: translateY(8px); opacity: 0; } 3% { transform: translateY(0); opacity: 1; } 45% { opacity: 1; } 100% { transform: translateY(-140px); opacity: 0; } }
@keyframes rollFade { 0% { opacity: 0; } 3% { opacity: 1; } 45% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .rollfloat .rf { animation-name: rollFade; } }

<script>
const PLACE_TYPES = [
  ['city', 'City'], ['town', 'Town'], ['village', 'Village'], ['dungeon', 'Dungeon'],
  ['landmark', 'Landmark'], ['wilderness', 'Wilderness'], ['poi', 'Point of interest'],
];
const ATTITUDES = [['friendly', 'Friendly'], ['neutral', 'Neutral'], ['hostile', 'Hostile'], ['unknown', 'Unknown']];
const GLYPH = {
  city: 'M10 22v-7l2-2v-3h2v3h2v-3h2v3l2 2v7z',
  town: 'M10 22v-6l7-6 7 6v6z',
  village: 'M11 22v-5l6-5 6 5v5z',
  dungeon: 'M11 22v-6a6 6 0 0 1 12 0v6h-4v-4h-4v4z',
  landmark: 'M12 23V9h10l-2 3 2 3h-8v8z',
  wilderness: 'M17 8l6 8h-3l4 5H10l4-5h-3z',
  poi: 'M17 8l2.4 5 5.4.7-4 3.7 1 5.4-4.8-2.6-4.8 2.6 1-5.4-4-3.7 5.4-.7z',
};
const PIN_BODY = 'M17 41C17 41 3 26 3 16a14 14 0 0 1 28 0c0 10-14 25-14 25z';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const initials = (n) => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '?';
const typeName = (t) => (PLACE_TYPES.find((p) => p[0] === t) || [, 'Place'])[1];
const attName = (a) => (ATTITUDES.find((p) => p[0] === a) || [, 'Neutral'])[1];
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

/* ---------- State ---------- */
let db = null, assets = null, editable = false, isDM = false, loaded = { maps: false, places: false, npcs: false };
// ALL = everything this viewer can read; D = what the current view shows (filtered in player view).
const PUB = { maps: new Map(), places: new Map(), npcs: new Map(), tokens: new Map() };
const HID = { maps: new Map(), places: new Map(), npcs: new Map(), tokens: new Map() };
const ALL = { maps: new Map(), places: new Map(), npcs: new Map(), tokens: new Map() };
let MEMBERS = [], myId = null, myName = '';
let tokenImgs = null;
let rollsCap = null;    // the host's shared roll feed, when it has one   // the host's token-picture uploader, when it has one (players can use it too)   // campaign members and who is viewing, when the host provides them
const SH = new Map();   // npc id -> { sheet, sheetFile }, readable by the DM only
const PS = new Map();   // place id -> { secret }, readable by the DM only
let D = ALL;
let playerView = store.get('atlas-player') === '1';
let curMap = store.get('atlas-map');
let sel = null;            // {kind:'place'|'npc', id}
let mode = 'move';         // move | place | npc | pin-npc | token | mytoken
let pinningNpc = null;     // npc id waiting for a map position
let tab = 'details';
let showLabels = store.get('atlas-labels') !== '0';
// DMs always see character sheets and secrets, except while previewing the player view.
const showSheets = () => isDM && !playerView;
let dataError = '';

/* ---------- Toast ---------- */
let toastT;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), err ? 6000 : 2600);
}

/* ---------- Data helpers ---------- */
// Hidden records live under dm/, which the access rules keep unreadable for players.
const HPATH = (col) => 'dm/hidden/' + col;
function pathOf(col, id) { const r = ALL[col].get(id); return r && r._h ? HPATH(col) : col; }
const clean = (d) => { const o = { ...d }; delete o.id; delete o._h; return o; };
async function put(col, id, data) {
  try { await db.collection(pathOf(col, id)).doc(id).set(clean(data)); return true; }
  catch (e) { writeErr(e); return false; }
}
async function patch(col, id, data) {
  try { await db.collection(pathOf(col, id)).doc(id).update(data); return true; }
  catch (e) { writeErr(e); return false; }
}
async function remove(col, id) {
  try {
    await db.collection(col).doc(id).delete();
    if (isDM) await db.collection(HPATH(col)).doc(id).delete();
    return true;
  } catch (e) { writeErr(e); return false; }
}
async function setHidden(col, id, h) {
  const r = ALL[col].get(id); if (!r || !!r._h === h) return;
  ALL[col].set(id, { ...r, _h: h }); afterData(true);
  try {
    await db.collection(h ? HPATH(col) : col).doc(id).set(clean(r));
    await db.collection(h ? col : HPATH(col)).doc(id).delete();
    toast(h ? `${r.name} is hidden from players.` : `${r.name} is now visible to players.`);
  } catch (e) { writeErr(e); }
}
async function putSecret(path, map, id, data) {
  const next = { ...(map.get(id) || {}), ...data }; map.set(id, next);
  try { await db.collection(path).doc(id).set(next); return true; }
  catch (e) { writeErr(e); return false; }
}
const putSheet = (id, data) => putSecret('dm/sheets/npcs', SH, id, data);
const putPlaceSecret = (id, data) => putSecret('dm/sheets/places', PS, id, data);
function rebuild() {
  if (isDM && !playerView) { D = ALL; return; }
  const visMap = (m, depth) => {
    if (!m || m._h || depth > 20) return false;
    if (!m.placeId) return true;
    const p = ALL.places.get(m.placeId);
    return !!p && !p._h && visMap(ALL.maps.get(p.mapId), depth + 1);
  };
  const maps = new Map([...ALL.maps].filter(([, m]) => visMap(m, 0)));
  const places = new Map([...ALL.places].filter(([, p]) => !p._h && maps.has(p.mapId)));
  const npcs = new Map([...ALL.npcs].filter(([, n]) => !n._h).map(([id, n]) => [id, {
    ...n, mapId: maps.has(n.mapId) ? n.mapId : null, placeId: places.has(n.placeId) ? n.placeId : null,
    links: (n.links || []).filter((l) => !ALL.npcs.get(l.to)?._h),
  }]));
  const tokens = new Map([...ALL.tokens].filter(([, t]) => !t._h && maps.has(t.mapId)));
  D = { maps, places, npcs, tokens };
}
function writeErr(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') toast('The campaign is full. Delete some maps, places or NPCs to add more.', true);
  else if (c === 'invalid_argument') { toast('You can view this campaign but not change it.', true); }
  else toast('Couldn’t save that change. Check your connection and try again.', true);
}
const mapsList = () => [...D.maps.values()].sort((a, b) => (a.created || 0) - (b.created || 0));
const placesOn = (mapId) => [...D.places.values()].filter((p) => p.mapId === mapId);
const npcsOn = (mapId) => [...D.npcs.values()].filter((n) => n.mapId === mapId);
const tokensOn = (mapId) => [...D.tokens.values()].filter((t) => t.mapId === mapId);
const isBattle = (m) => !!(m && m.battle);
const TOKEN_COLORS = ['#c0392b', '#d9822b', '#b7791f', '#2f855a', '#319795', '#2b6cb0', '#6b46c1', '#d53f8c', '#4a5568'];
const tokColor = (c) => (/^#[0-9a-fA-F]{6}$/.test(c || '') ? c : '#4a5568');
const TOKEN_SIZES = [[1, 'Medium or smaller'], [2, 'Large'], [3, 'Huge'], [4, 'Gargantuan']];
// Grid squares are measured in map-image pixels: "squares across" divides the image width.
function gridOf(m) {
  const n = clamp(Number(m.gridN) || 20, 2, 200);
  return { cell: (m.w || 1600) / n, ox: Number(m.gridOX) || 0, oy: Number(m.gridOY) || 0 };
}
// Odd-sized tokens sit in the middle of a square; even-sized ones sit on a grid corner.
function snapTok(m, p, size) {
  const g = gridOf(m), w = m.w || 1600, h = m.h || 1000;
  const f = (v, o) => (size % 2 ? (Math.floor((v - o) / g.cell) + .5) * g.cell : Math.round((v - o) / g.cell) * g.cell) + o;
  return { x: clamp(f(p.x * w, g.ox) / w, 0, 1), y: clamp(f(p.y * h, g.oy) / h, 0, 1) };
}
// A token linked to an NPC shows the NPC's name unless the token has its own name.
// Players only see the link when the NPC itself is visible to them.
const tokNpc = (t) => (t && t.npcId ? D.npcs.get(t.npcId) : null);
const tokLabel = (t) => t.name || (tokNpc(t) ? tokNpc(t).name : t.npcId ? 'Unknown' : 'Token');
const ATT_COLOR = { friendly: '#2f855a', hostile: '#c0392b', neutral: '#4a5568', unknown: '#b7791f' };
// Only plain URLs and same-site paths are drawn as token pictures.
const safeImg = (u) => (/^(https?:\/\/|\/)[\w\-./%~:?=&+]+$/.test(String(u || '')) ? String(u) : '');
const canMoveTok = (t) => !!t && (editable || (!!myId && t.owner === myId && !isDM));
const canPicture = (t) => canMoveTok(t) && !!(tokenImgs || (editable && assets));
const childMaps = (placeId) => mapsList().filter((m) => m.placeId === placeId);
function mapPath(mapId) {
  const out = []; const seen = new Set(); let m = D.maps.get(mapId);
  while (m && !seen.has(m.id)) {
    seen.add(m.id); out.unshift(m);
    const p = m.placeId && D.places.get(m.placeId);
    m = p ? D.maps.get(p.mapId) : null;
  }
  return out;
}
function placeLabel(id) {
  const p = D.places.get(id); if (!p) return '';
  const m = D.maps.get(p.mapId);
  return m ? `${p.name} (${m.name})` : p.name;
}

/* ---------- Pan & zoom ---------- */
const vp = $('#vp'), stage = $('#stage'), img = $('#mapImg');
const V = { s: 1, tx: 0, ty: 0, w: 1, h: 1, min: .05 };
function applyView() {
  stage.style.transform = `translate(${V.tx}px, ${V.ty}px) scale(${V.s})`;
  stage.style.setProperty('--inv', 1 / V.s);
}
function fit() {
  const r = vp.getBoundingClientRect(); if (!r.width) return;
  const s = Math.min(r.width / V.w, (r.height - 40) / V.h) * .96;
  V.min = s * .5; V.s = s;
  V.tx = (r.width - V.w * s) / 2; V.ty = 40 + (r.height - 40 - V.h * s) / 2;
  applyView();
}
function zoomAt(px, py, k) {
  const ns = clamp(V.s * k, V.min, 6); const f = ns / V.s;
  V.tx = px - (px - V.tx) * f; V.ty = py - (py - V.ty) * f; V.s = ns; applyView();
}
function centerOn(x, y) {
  const r = vp.getBoundingClientRect();
  if (V.s < V.min * 2.4) V.s = V.min * 2.4;
  V.tx = r.width / 2 - x * V.w * V.s; V.ty = r.height / 2 - y * V.h * V.s; applyView();
}
function toMap(cx, cy) {
  const r = vp.getBoundingClientRect();
  return { x: (cx - r.left - V.tx) / V.s / V.w, y: (cy - r.top - V.ty) / V.s / V.h };
}
vp.addEventListener('wheel', (e) => {
  if (!curMap) return; e.preventDefault();
  const r = vp.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0015)));
}, { passive: false });
$('#zIn').addEventListener('click', () => { const r = vp.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.35); });
$('#zOut').addEventListener('click', () => { const r = vp.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1 / 1.35); });
$('#zFit').addEventListener('click', fit);
let userMoved = false;
new ResizeObserver(() => { if (curMap && V.w > 1 && !userMoved) fit(); }).observe(vp);

const ptrs = new Map();
let gesture = null; // {kind:'pan'|'pin'|'pinch', ...}
vp.addEventListener('pointerdown', (e) => {
  if (!curMap || e.button > 0) return;
  vp.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    gesture = { kind: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, moved: true };
    return;
  }
  const pinEl = e.target.closest('.pin');
  gesture = { kind: pinEl ? 'pin' : 'pan', pinEl, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, moved: false };
});
vp.addEventListener('pointermove', (e) => {
  if (!ptrs.has(e.pointerId) || !gesture) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (gesture.kind === 'pinch' && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const r = vp.getBoundingClientRect();
    V.tx += mx - gesture.mx; V.ty += my - gesture.my;
    zoomAt(mx - r.left, my - r.top, d / gesture.d);
    gesture.d = d; gesture.mx = mx; gesture.my = my; userMoved = true;
    return;
  }
  if (!gesture.moved && Math.hypot(e.clientX - gesture.sx, e.clientY - gesture.sy) > 5) {
    gesture.moved = true;
    if (gesture.kind === 'pin') {
      const k = gesture.pinEl.dataset.kind;
      const ok = mode === 'move' && (k === 'token' ? canMoveTok(D.tokens.get(gesture.pinEl.dataset.id)) : editable);
      if (!ok) gesture.kind = 'pan';
    }
    if (gesture.kind === 'pin') gesture.pinEl.classList.add('dragging'); else vp.classList.add('panning');
  }
  if (!gesture.moved) return;
  if (gesture.kind === 'pan') {
    V.tx += e.clientX - gesture.lx; V.ty += e.clientY - gesture.ly; applyView(); userMoved = true;
  } else if (gesture.kind === 'pin') {
    const p = toMap(e.clientX, e.clientY);
    gesture.pinEl.style.left = clamp(p.x, 0, 1) * 100 + '%'; gesture.pinEl.style.top = clamp(p.y, 0, 1) * 100 + '%';
  }
  gesture.lx = e.clientX; gesture.ly = e.clientY;
});
function endPointer(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  const g = gesture;
  if (ptrs.size > 0) { if (g && g.kind === 'pinch') { const [a] = [...ptrs.values()]; gesture = { kind: 'pan', sx: a.x, sy: a.y, lx: a.x, ly: a.y, moved: true }; } return; }
  gesture = null; vp.classList.remove('panning');
  if (!g || e.type === 'pointercancel') { render(); return; }
  if (g.kind === 'pin' && g.moved) {
    g.pinEl.classList.remove('dragging');
    const p = toMap(e.clientX, e.clientY);
    const kind = g.pinEl.dataset.kind, id = g.pinEl.dataset.id;
    const col = kind === 'place' ? 'places' : kind === 'token' ? 'tokens' : 'npcs';
    const rec = D[col].get(id);
    if (rec) {
      let x = clamp(p.x, 0, 1), y = clamp(p.y, 0, 1);
      const m = kind === 'token' && D.maps.get(rec.mapId);
      if (m) ({ x, y } = snapTok(m, { x, y }, rec.size || 1));
      D[col].set(id, { ...rec, x, y });
      if (kind === 'token') renderMap();
      patch(col, id, { x, y });
    }
    return;
  }

/* ---------- Floating rolls ---------- */
const ROLL_MS = 15000;
const shownRolls = new Set();
// Shows a roll above a token on the open map. `age` lets a roll that arrived late start part-way through.
function floatRoll(t, roll, age) {
  const m = D.maps.get(curMap);
  if (!t || !m || t.mapId !== curMap || age >= ROLL_MS) return false;
  const r = isBattle(m) ? gridOf(m).cell * (t.size || 1) * .45 : 16;
  const el = document.createElement('div');
  el.className = 'rollfloat' + (roll.nat === 20 ? ' nat20' : roll.nat === 1 ? ' nat1' : '');
  el.style.left = t.x * 100 + '%'; el.style.top = t.y * 100 + '%'; el.style.marginTop = -r + 'px';
  el.innerHTML = `<div class="rf" style="animation-delay:-${Math.round(age)}ms"><span class="who">${esc(roll.who || '')}</span><span class="what">${esc(roll.label || '')}</span><span class="tot">${esc(roll.total)}</span><span class="det">${esc(roll.detail || '')}${roll.nat === 20 ? ' · nat 20' : roll.nat === 1 ? ' · nat 1' : ''}</span></div>`;
  $('#floats').appendChild(el);
  setTimeout(() => el.remove(), ROLL_MS - age + 100);
  return true;
}
// Rolls other people made, delivered by the host with its clock (`now`) so ages are right.
window.addEventListener('atlas-rolls', (e) => {
  const { rolls = [], now = Date.now() } = e.detail || {};
  [...rolls].reverse().forEach((roll) => {
    if (shownRolls.has(roll.id)) return;
    shownRolls.add(roll.id);
    if (roll.by === myId) return;   // our own rolls were shown when we made them
    const age = now - roll.at;
    if (age >= ROLL_MS) return;
    const shown = floatRoll(tokensOn(curMap).find((t) => t.owner === roll.uid), roll, age);
    if (!shown && age < 5000) toast(`${roll.who} · ${roll.label}: ${roll.total} (${roll.detail})${roll.nat === 20 ? ' · natural 20' : roll.nat === 1 ? ' · natural 1' : ''}`);
  });
});

async function deleteNpc(id) {

}

    for (const c of childMaps(p.id)) { D.maps.set(c.id, { ...c, placeId: null }); await patch('maps', c.id, { placeId: null }); }
    D.places.delete(p.id); await remove('places', p.id);

function renderPane(force) {
  if (((sel && sel.kind === 'token') || tab === 'party') && editable) refreshMembers();   // the host throttles this, so it's cheap
  const pane = $('#pane');
  if (!force && pane.contains(document.activeElement) && document.activeElement.matches('input, textarea, select')) { paneDirty = true; return; }
  paneDirty = false;
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  const st = pane.scrollTop;
  pane.innerHTML = tab === 'npcs' ? rosterHTML() : tab === 'web' ? webHTML() : tab === 'party' ? partyHTML() : detailsHTML();
  pane.scrollTop = st;
}
$('#pane').addEventListener('focusout', (e) => { if (paneDirty && !$('#pane').contains(e.relatedTarget)) setTimeout(() => renderPane(), 0); });
function render(force) { renderHeader(); renderMap(); renderPane(force); }

document.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; renderPane(true); } });

/* ---------- Rail events ---------- */
$('#pane').addEventListener('change', async (e) => {
  if (e.target.dataset.vis && editable) { setHidden(e.target.dataset.vis, e.target.dataset.id, !e.target.checked); return; }
  const f = e.target.dataset.f; if (!f) return;
  if (!editable && !(f.startsWith('token:') && canMoveTok(D.tokens.get(sel && sel.id)))) return;
  const [kind, field] = f.split(':');
  if (kind === 'sheet') {
    const n = D.npcs.get(sel && sel.id); if (!n) return;
    let v = e.target.value.trim();
    if (ABIL.includes(field)) { v = v === '' ? null : clamp(parseInt(v, 10) || 10, 1, 30); e.target.value = v ?? ''; }
    const sheet = (SH.get(n.id) || {}).sheet || {};
    if (sheet[field] === v) return;
    if (ABIL.includes(field)) { const b = document.querySelector(`[data-ab="${field}"]`); if (b) b.textContent = fmtMod(abMod(v)); }
    await putSheet(n.id, { sheet: { ...sheet, [field]: v } });
    return;
  }
  if (kind === 'psecret') {
    const p = D.places.get(sel && sel.id); if (!p) return;
    if ((PS.get(p.id) || {}).secret === e.target.value) return;
    await putPlaceSecret(p.id, { secret: e.target.value });
    return;
  }
  const col = kind === 'map' ? 'maps' : kind === 'place' ? 'places' : kind === 'token' ? 'tokens' : 'npcs';
  const id = kind === 'map' ? curMap : sel && sel.id;
  const rec = D[col].get(id); if (!rec) return;
  let v = e.target.value;
  if (field === 'name') { v = v.trim(); if (!v && !(kind === 'token' && rec.npcId)) v = rec.name; e.target.value = v; }
  if (field === 'placeId' || field === 'owner' || field === 'npcId') v = v || null;
  if (e.target.type === 'checkbox') v = e.target.checked;
  if (field === 'gridN') v = clamp(parseInt(v, 10) || 20, 2, 200);
  if (field === 'gridOX' || field === 'gridOY') v = Number(v) || 0;
  if (field === 'gridShow') v = v === '1';
  if (field === 'size') v = clamp(parseInt(v, 10) || 1, 1, 4);
  if (rec[field] === v) return;
  // Linking a token to an NPC takes the NPC's name and attitude colour.
  if (kind === 'token' && field === 'npcId' && v) {
    const n = D.npcs.get(v), extra = { npcId: v, name: '', color: ATT_COLOR[n && n.attitude] || rec.color };
    D.tokens.set(id, { ...rec, ...extra }); renderMap(); renderPane(true);
    await patch('tokens', id, extra);
    return;
  }
  D[col].set(id, { ...rec, [field]: v });
  renderHeader(); renderMap();
  if (e.target.tagName === 'SELECT' || e.target.type === 'checkbox') renderPane(true);
  await patch(col, id, { [field]: v });
});
$('#pane').addEventListener('input', (e) => { if (e.target.id === 'npcSearch') { npcQuery = e.target.value; const pos = e.target.selectionStart; renderPane(true); const s = $('#npcSearch'); s.focus(); s.setSelectionRange(pos, pos); } });
$('#pane').addEventListener('submit', async (e) => {
  if (e.target.id === 'untoldForm') {
    e.preventDefault();
    const n = D.npcs.get(sel && sel.id); const text = $('#uText').value.trim();
    if (!n || !text || !editable) return;
    const untold = [...((SH.get(n.id) || {}).untold || []), { id: uid(), text }];
    const done = putSheet(n.id, { untold }); renderPane(true);
    const inp = $('#uText'); if (inp) inp.focus();
    await done; return;
  }
  if (e.target.id !== 'linkForm') return; e.preventDefault();
  const n = D.npcs.get(sel && sel.id); const to = $('#lTo').value; const label = $('#lLabel').value.trim() || 'knows';
  if (!n || !to) return;
  const links = (n.links || []).filter((l) => l.to !== to).concat([{ to, label }]);
  D.npcs.set(n.id, { ...n, links }); renderPane(true);
  await patch('npcs', n.id, { links });
});
$('#pane').addEventListener('click', (e) => {
  const s = e.target.closest('[data-sel]');
  if (s) { select(s.dataset.sel, s.dataset.id); return; }
  const mp = e.target.closest('[data-map]');
  if (mp) { openMap(mp.dataset.map); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  const cur = sel && (sel.kind === 'place' ? D.places.get(sel.id) : sel.kind === 'token' ? D.tokens.get(sel.id) : D.npcs.get(sel.id));
  if (act === 'back') { sel = null; render(true); }
  else if (act === 'add-child' && cur) armUpload(cur.id);
  else if (act === 'npc-here' && cur) createNpc({ placeId: cur.id });
  else if (act === 'new-npc') createNpc({});
  else if (act === 'pin-npc' && cur) setMode('pin-npc', cur.id);
  else if (act === 'tok-npc' && cur) setMode('tok-npc', cur.id);
  else if (act === 'unpin-npc' && cur) { D.npcs.set(cur.id, { ...cur, mapId: null, x: null, y: null }); render(true); patch('npcs', cur.id, { mapId: null, x: null, y: null }); }
  else if (act === 'goto-npc' && cur) { if (cur.mapId !== curMap) openMap(cur.mapId, true); centerOn(cur.x, cur.y); }
  else if (act === 'unlink') {
    const o = D.npcs.get(b.dataset.owner); if (!o) return;
    const links = (o.links || []).filter((l) => l.to !== b.dataset.to);
    D.npcs.set(o.id, { ...o, links }); renderPane(true); patch('npcs', o.id, { links });
  }
  else if (act === 'del-place' && cur) arm(b, 'dp' + cur.id, 'Click again to delete', () => deletePlace(cur.id));
  else if (act === 'cs-open') { openSheet(b.dataset.uid); }
  else if (act === 'tok-img' && cur) { tokImgFor = cur.id; $('#tokImgIn').value = ''; }
  else if (act === 'tok-img-rm' && cur && canPicture(cur)) {
    const old = cur.img; D.tokens.set(cur.id, { ...cur, img: null }); render(true);
    patch('tokens', cur.id, { img: null }).then((ok) => { if (ok && old) deleteTokenImage(old); });
  }
  else if (act === 'tok-color' && cur && canMoveTok(cur)) {
    const color = b.dataset.color; D.tokens.set(cur.id, { ...cur, color }); render(true); patch('tokens', cur.id, { color });
  }
  else if (act === 'del-token' && cur) arm(b, 'dt' + cur.id, 'Click again to remove', async () => {
    D.tokens.delete(cur.id); sel = null; render(true); await remove('tokens', cur.id);
  });
  else if ((act === 'reveal' || act === 'untold-del') && cur) {
    const list = (SH.get(cur.id) || {}).untold || [];
    const it = list.find((x) => x.id === b.dataset.uid); if (!it) return;
    const untold = list.filter((x) => x !== it);
    if (act === 'reveal') {
      const notes = (cur.notes || '').trimEnd();
      const next = (notes ? notes + '\n' : '') + '- ' + it.text;
      D.npcs.set(cur.id, { ...cur, notes: next });
      putSheet(cur.id, { untold }); renderPane(true);
      patch('npcs', cur.id, { notes: next }).then((ok) => ok && toast(`Added to what the party knows about ${cur.name}.`));
    } else { putSheet(cur.id, { untold }); renderPane(true); toast('Note deleted.'); }
  }
  else if (act === 'roll-abil' && cur) {
    const r = d20(), m = abMod(((SH.get(cur.id) || {}).sheet || {})[b.dataset.ab]);
    const roll = { who: cur.name, label: b.dataset.ab.toUpperCase() + ' check', total: r + m, detail: `${r} ${m < 0 ? '\u2212' : '+'} ${Math.abs(m)}`, nat: r === 20 ? 20 : r === 1 ? 1 : null };
    toast(`${roll.who} \u00b7 ${roll.label}: ${roll.total} (${roll.detail})${roll.nat === 20 ? ' \u00b7 natural 20' : roll.nat === 1 ? ' \u00b7 natural 1' : ''}`);
    // NPC rolls stay on the DM's screen: shown over the NPC's token here, never shared.
    floatRoll(tokensOn(curMap).find((t) => t.npcId === cur.id), roll, 0);
  }

  else if (act === 'sheet-attach' && cur) { sheetFor = cur.id; $('#sheetIn').value = ''; }
  else if (act === 'sheet-remove' && cur) arm(b, 'sr' + cur.id, 'Click again to remove', async () => {
    const old = (SH.get(cur.id) || {}).sheetFile;
    const done = putSheet(cur.id, { sheetFile: null }); renderPane(true);
    if (await done) { try { if (old && assets) await assets.delete(old.id); } catch (e) {} toast('Sheet removed.'); }
  });
  else if (act === 'del-npc' && cur) arm(b, 'dn' + cur.id, 'Click again to delete', () => deleteNpc(cur.id));
  else if (act === 'del-map') arm(b, 'dm' + curMap, 'Click again to delete map', () => deleteMap(curMap));
  else if (act === 'clear-ex') arm(b, 'cx', 'Click again to remove examples', clearExamples);
});
$('#pane').addEventListener('keydown', (e) => {
  const g = e.target.closest && e.target.closest('g[data-sel]');
  if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select('npc', g.dataset.id); }
});

/* ---------- Boot ---------- */
function afterData(force) {
  rebuild();
  if (curMap && !D.maps.has(curMap)) curMap = null;
  if (!curMap && D.maps.size) { const top = mapsList().find((m) => !m.placeId) || mapsList()[0]; curMap = top.id; }
  const m = curMap && D.maps.get(curMap);
  if (m && img.getAttribute('src') !== '/_blob/' + m.asset) loadImage();
  if (sel && !(sel.kind === 'place' ? D.places : sel.kind === 'token' ? D.tokens : D.npcs).has(sel.id)) sel = null;
  render(force);
}
function onSnapErr(err) {
  dataError = err && err.code === 'revoked' ? 'Access to this campaign changed. Reload the page.' : 'The campaign stopped updating. Reload the page to reconnect.';
  toast(dataError, true);
}
function subscribe(col, hidden) {
  db.collection(hidden ? HPATH(col) : col).onSnapshot((snap) => {
    (hidden ? HID : PUB)[col] = new Map(snap.docs.map((d) => [d.id, hidden ? { id: d.id, ...d.data(), _h: true } : { id: d.id, ...d.data() }]));
    ALL[col] = new Map([...PUB[col], ...HID[col]]);
    if (!hidden) loaded[col] = true;
    afterData();
  }, onSnapErr);
}
function subscribeSecrets(path, target) {
  db.collection(path).onSnapshot((snap) => {
    target.clear(); snap.docs.forEach((d) => target.set(d.id, d.data()));
    renderPane();
  }, onSnapErr);
}
render();
(async () => {
  const c = window.claude;
  if (!c || !c.use) { dataError = 'Open this page in Claude while signed in to load the campaign.'; render(); return; }
  const [d, a, u] = await Promise.all([c.use('db').catch(() => null), c.use('assets').catch(() => null), c.use('user').catch(() => null)]);
  db = d; assets = a;
  if (!db) { dataError = 'Sign in to Claude to see this campaign.'; render(); return; }
  // The DM is anyone who can edit the artifact (the owner, or people given Editor access).
  try { isDM = u ? await u.canEdit() : !!assets; } catch (e) { isDM = !!assets; }
  editable = isDM && !playerView;
  try {
    if (u && u.id) myId = await u.id();
    if (u && u.name) myName = await u.name();
    if (u && u.members) MEMBERS = await u.members();
    userCap = u;
    tokenImgs = await c.use('tokenImages').catch(() => null);
    rollsCap = await c.use('rolls').catch(() => null);
  } catch (e) {}
  if (isDM && !assets) console.warn('Atlas: assets capability unavailable in this view; map uploads disabled.');
  ['maps', 'places', 'npcs', 'tokens'].forEach((col) => subscribe(col, false));
  if (isDM) {
    ['maps', 'places', 'npcs', 'tokens'].forEach((col) => subscribe(col, true));
    subscribeSecrets('dm/sheets/npcs', SH);
    subscribeSecrets('dm/sheets/places', PS);
  }
  // Character sheets: the host sends a player only their own; DMs get everyone's.
  if (myId) db.collection('characters').onSnapshot((snap) => {
    CH.clear(); snap.docs.forEach((d) => CH.set(d.id, d.data())); chLoaded = true;
    if (tab === 'party') renderPane();
    if (!$('#csModal').hidden) refreshSheet();
  }, onSnapErr);
  applyDm(); afterData(true);
})();
</script>
