<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaign Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root { --bg: #e6ebef; --surface: #f8fafb; --ink: #1a2330; --muted: #5a6879; --line: #c8d1da; --accent: #2b4c8c; --on-accent: #fff; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #11151b; --surface: #19202a; --ink: #e2e7ee; --muted: #8e9bad; --line: #2c3543; --accent: #8fb0ec; --on-accent: #0f1726; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: var(--bg); color: var(--ink); font: 16px/1.5 "Source Sans 3", system-ui, sans-serif; }
main { max-width: 460px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px; display: grid; gap: 14px; }
h1 { font: 700 1.7rem "Cinzel", Georgia, serif; margin: 0; }
p { margin: 0; color: var(--muted); }
a.btn { justify-self: start; background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 600; padding: .6rem 1rem; border-radius: 8px; }
</style>
</head>
<body>
<main>
  <h1>Campaign Atlas</h1>
  <p>Maps, places, NPCs and their connections for our D&amp;D campaign. The atlas runs in Claude, where the campaign is stored. Sign in with an account that has access.</p>
  <a class="btn" href="https://claude.ai/artifact/PaxWd1yWAy6o1hT5Ddb2YB">Open the atlas</a>
</main>
</body>
</html>
